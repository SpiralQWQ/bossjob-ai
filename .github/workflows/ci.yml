# CI 质量护栏（BossJobAI 前端 + Electron）
# 位置：同步到开源仓库根 `.github/workflows/ci.yml`（SpiralQWQ/bossjob-ai）即自动生效；
# 本文件放在本地 code/.github 作为模板/交付物。每次 push/PR 自动跑：单测 → 构建(含 verify-csp) → 禁硬编码色 → 白名单。
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json

      - name: Install frontend
        working-directory: code/frontend
        run: npm ci

      - name: Unit tests
        working-directory: code/frontend
        run: npm test

      - name: Build (tsc + vite + verify-csp)
        working-directory: code/frontend
        run: npm run build

      - name: No hardcoded colors (DESIGN §10)
        working-directory: code/frontend
        run: npm run verify:colors

      - name: Endpoint whitelist
        working-directory: code/electron
        run: npm run verify:whitelist
